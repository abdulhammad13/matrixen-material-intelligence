name: NUMMF Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package and workstation test dependencies
        run: python -m pip install -e ".[dev,dashboard,ingestion]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Lint
        run: ruff check .
      - name: Type check core contracts
        run: mypy src/cpse_harmonizer/domain src/cpse_harmonizer/data_quality
      - name: Test
        run: python -m pytest -q
      - name: Import smoke test
        run: python -c "from cpse_harmonizer.api.main import app; assert app.title.startswith('National Unified')"
